spring:
  application:
    name: comparison-spring-ai
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/${DB_NAME:corpusai}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB
  ai:
    openai:
      api-key: ${OPENAI_API_KEY}
      chat:
        options:
          model: gpt-5.4-mini
          temperature: 0.7
      embedding:
        options:
          model: text-embedding-3-small
    anthropic:
      api-key: ${ANTHROPIC_API_KEY}
      chat:
        options:
          model: claude-haiku-4-5
          temperature: 0.7
          max-tokens: 4096
    vectorstore:
      pgvector:
        initialize-schema: true
        table-name: comparison_vector_store
        dimensions: 1536
        index-type: HNSW
        distance-type: COSINE_DISTANCE

server:
  port: 8081

management:
  endpoints:
    web:
      exposure:
        include: metrics